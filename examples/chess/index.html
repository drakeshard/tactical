<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A playable Drakeshard Tactical chess integration specimen." />
    <title>Drakeshard Tactical — Chess</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">D</div>
          <div>
            <p class="brand-kicker">Drakeshard Tactical</p>
            <h1>Chess</h1>
          </div>
        </div>
        <button id="new-game-top" class="ghost-button" type="button">New game</button>
      </header>

      <main class="game-layout">
        <section class="board-stage" aria-label="Chess game">
          <div id="black-player" class="player-strip">
            <div class="player-main">
              <div class="player-token" aria-hidden="true">♚</div>
              <div>
                <span id="black-name" class="player-label">Black</span>
                <span id="black-role" class="player-subtitle">Local player</span>
              </div>
            </div>
            <time id="black-clock" class="clock">5:00</time>
          </div>

          <div class="board-frame">
            <div id="board" class="board"></div>
          </div>

          <div id="white-player" class="player-strip">
            <div class="player-main">
              <div class="player-token" aria-hidden="true">♔</div>
              <div>
                <span id="white-name" class="player-label">White</span>
                <span id="white-role" class="player-subtitle">Local player</span>
              </div>
            </div>
            <time id="white-clock" class="clock">5:00</time>
          </div>
        </section>

        <aside class="sidebar">
          <section class="status-panel">
            <div class="status-row">
              <span id="turn-dot" class="turn-dot" aria-hidden="true"></span>
              <p id="status" class="status-copy">White to move</p>
            </div>
          </section>

          <section class="setup-panel">
            <div class="panel-title-row">
              <h2>Game</h2>
              <span id="mode-summary" class="mode-summary">Local · 5 min</span>
            </div>

            <label class="field" for="mode">
              <span>Mode</span>
              <select id="mode">
                <option value="local">Local 2-player</option>
                <option value="ai">Vs AI</option>
              </select>
            </label>

            <div id="ai-settings" class="ai-settings" hidden>
              <label class="field" for="difficulty">
                <span>AI difficulty</span>
                <select id="difficulty">
                  <option value="easy">Easy</option>
                  <option value="normal" selected>Normal</option>
                  <option value="hard">Hard</option>
                </select>
              </label>

              <label class="field" for="human-side">
                <span>Your side</span>
                <select id="human-side">
                  <option value="white">White</option>
                  <option value="black">Black</option>
                </select>
              </label>
            </div>

            <label class="field" for="time-control">
              <span>Time control</span>
              <select id="time-control">
                <option value="3">3 minutes</option>
                <option value="5" selected>5 minutes</option>
                <option value="10">10 minutes</option>
                <option value="unlimited">Unlimited</option>
              </select>
            </label>

            <label class="field" for="promotion">
              <span>Promotion</span>
              <select id="promotion">
                <option value="queen">Queen</option>
                <option value="rook">Rook</option>
                <option value="bishop">Bishop</option>
                <option value="knight">Knight</option>
              </select>
            </label>

            <button id="new-game" class="primary-button" type="button">Start new game</button>
          </section>

          <section class="history-panel">
            <div class="panel-title-row">
              <h2>Moves</h2>
              <span id="move-count" class="count-badge">0</span>
            </div>
            <ol id="moves" class="moves"></ol>
          </section>
        </aside>
      </main>
    </div>

    <script type="module" src="./dist/examples/chess/src/main.js"></script>
  </body>
</html>
